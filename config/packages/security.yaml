security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_DIRECTION: [ROLE_SCOLARITE, ROLE_ENSEIGNANT, ROLE_EDUCATEUR, ROLE_COMPTABLE]
        ROLE_ADMINISTRATEUR: [ROLE_DIRECTION, ROLE_ALLOWED_TO_SWITCH]

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_users
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
            entry_point: form_login

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/symfony/finance, roles: [ROLE_COMPTABLE, ROLE_DIRECTION] }
        - { path: ^/symfony/evaluations, roles: [ROLE_ENSEIGNANT, ROLE_SCOLARITE, ROLE_DIRECTION] }
        - { path: ^/symfony/attendance, roles: [ROLE_ENSEIGNANT, ROLE_EDUCATEUR, ROLE_SCOLARITE, ROLE_DIRECTION] }
        - { path: ^/symfony/report-cards, roles: [ROLE_ENSEIGNANT, ROLE_SCOLARITE, ROLE_DIRECTION] }
        - { path: ^/symfony/students, roles: [ROLE_SCOLARITE, ROLE_DIRECTION] }
        - { path: ^/symfony/classes, roles: [ROLE_SCOLARITE, ROLE_ENSEIGNANT, ROLE_DIRECTION] }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
